name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install ".[test]"

      - name: Run tests
        run: .venv/bin/python -m pytest -m "not symbolic"

  symbolic-verification:
    name: Symbolic verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and verification dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install ".[test]"

      - name: Verify symbolic derivations
        run: .venv/bin/python -m pytest -m symbolic
